[workspace]
members = ["crates/agent", "crates/proto", "crates/relay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22.1"
blake3 = "1.8.2"
bytes = { version = "1.11.1", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
cookie = "0.18.1"
dashmap = "6.1.0"
data-encoding = "2.9.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
futures-util = "0.3.31"
http = "1.4.0"
keyring = { version = "3.6.3", features = ["apple-native", "linux-native", "windows-native"] }
parking_lot = "0.12.5"
portable-pty = "0.9.0"
prost = "0.14.1"
prost-build = "0.14.1"
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "json", "native-tls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "uuid"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde"] }
toml = "0.9.8"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "native-tls", "url"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tower = { version = "0.5.2", features = ["limit", "timeout"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde", "v7"] }
vt100 = "0.16.2"
webauthn-rs = "0.5.5"
zeroize = "1.8.2"
